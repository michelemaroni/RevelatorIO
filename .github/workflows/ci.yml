name: package-and-docs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test tools
        run: python -m pip install --upgrade pip setuptools wheel '.[test]'
      - name: Verify the release package
        run: python -m pytest -q tests/test_io24_release_package.py

  hardware-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the documented GTK and ALSA build runtimes
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            python3-gi python3-gi-cairo python3-venv \
            gir1.2-gtk-4.0 gir1.2-adw-1 \
            alsa-utils libasound2-dev libjson-c-dev
      - name: Install project and test tools
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip setuptools wheel '.[test]'
      - name: Build and test the ALSA control bridge
        run: make test
      - name: Run hardware-free release suite
        run: >-
          .venv/bin/python -m pytest -q
          tests/test_io24_fx_model_transition.py
          tests/test_io24_host_parameter_repairs.py
          tests/test_io24_host_rate_and_effects.py
          tests/test_io24_host_resume.py
          tests/test_io24_host_state_repair.py
          tests/test_io24_global_fx.py
          tests/test_io24_scene.py
          tests/test_io24_uc_parity_closure.py
          tests/test_io24_standard_eq_ui.py
          tests/test_io24_vintage_eq_view.py
          tests/test_io24_spring.py
          tests/test_io24_multiband_insert.py
          tests/test_io24_voicefx_delay.py
          tests/test_publication_docs.py
          tests/test_io24_release_package.py
